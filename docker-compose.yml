services:
  selenium:
    image: selenium/standalone-chrome:latest
    container_name: selenium

  test-runner:
    build: .
    container_name: test-runner
    depends_on:
      - selenium
    volumes:
      - ./target:/app/target
    environment:
      - SELENIUM_HOST=${SELENIUM_HOST}
      - SELENIUM_PORT=${SELENIUM_PORT}
    entrypoint: ""